[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medinfer"
version = "0.1.0"
description = "Symptom extraction (medSpaCy + QuickUMLS) feeding a weighted forward-chaining diagnosis engine"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "medspacy>=1.3",   # pulls in medspacy_quickumls, PyRuSH, spaCy 3.7
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Second linker, used as a baseline against QuickUMLS (no UMLS licence needed).
scispacy = ["scispacy>=0.5"]

[project.scripts]
medinfer = "medinfer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medinfer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Noise from inside spaCy / medSpaCy, not our code.
    "ignore::DeprecationWarning:spacy.*",
    "ignore:.*W036.*:UserWarning",
]
